<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог товаров — PrimArte</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <nav class="header__nav">
            <a href="index.html"><img src="assets/logo.png" alt="PrimArte" class="header__logo"></a>
            <nav class="header__text">
                <a href="catalog.html" class="nav-item">Каталог товаров</a>
                <a href="price.html" class="nav-item">Прайс-лист</a>
                <a href="contacts.html" class="nav-item">Контакты</a>
                <a href="about.html" class="nav-item">О компании</a>
            </nav>
        </nav>
    </header>

    <main>
        <section class="page-hero">
            <h1 class="page-hero__title">Каталог <span>товаров</span></h1>
        </section>

        <section class="catalog">
            <div class="catalog__grid">
                <article class="product-card">
                    <div class="product-card__image">
                        <img src="assets/ph1.jpg" alt="free pictures">
                    </div>
                    <div class="product-card__body">
                        <h3 class="product-card__title">free pictures</h3>
                        <span class="product-card__price">бесплатно</span>
                    </div>
                </article>

                <article class="product-card">
                    <div class="product-card__image">
                        <img src="assets/ph2.jpg" alt="paid pictures">
                    </div>
                    <div class="product-card__body">
                        <h3 class="product-card__title">paid pictures</h3>
                        <span class="product-card__price">от 120 руб.</span>
                    </div>
                </article>

                <article class="product-card">
                    <div class="product-card__image">
                        <img src="assets/ph3.gif" alt="GIFs">
                    </div>
                    <div class="product-card__body">
                        <h3 class="product-card__title">GIFs</h3>
                        <span class="product-card__price">от 300 руб.</span>
                    </div>
                </article>

                <article class="product-card">
                    <div class="product-card__image">
                        <img src="assets/ph4.gif" alt="Animations">
                    </div>
                    <div class="product-card__body">
                        <h3 class="product-card__title">Animations</h3>
                        <span class="product-card__price">от 500 руб.</span>
                    </div>
                </article>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer__inner">
            <img src="assets/logo.png" alt="PrimArte" class="footer__logo">
            <nav class="footer__links">
                <a href="catalog.html">Каталог товаров</a>
                <a href="price.html">Прайс-лист</a>
                <a href="contacts.html">Контакты</a>
                <a href="about.html">О компании</a>
            </nav>
            <p class="footer__copy">&copy; 2026 PrimArte</p>
        </div>
    </footer>
</body>
</html>
