<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>PrimArte</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="styles.css">
	<link rel="stylesheet" href="print.css" id="PrintStyles">
</head>
<body>
	<header class="header">
		<nav class="header__nav">
			<a href="index.html">
				<img src="assets/logo.png" alt="PrimArte" class="header__logo">
			</a>
			<input type="checkbox" id="menu-toggle" class="menu-toggle">
			<label for="menu-toggle" class="menu-toggle-label" aria-label="Меню">
				<span></span>
				<span></span>
				<span></span>
			</label>
			<ul class="header__menu">
				<li><a href="catalog.html" class="nav-item">Каталог товаров</a></li>
				<li><a href="price.html" class="nav-item">Прайс-лист</a></li>
				<li><a href="contacts.html" class="nav-item">Контакты</a></li>
				<li><a href="about.html" class="nav-item">О компании</a></li>
			</ul>
			<button type="button" class="print_toggleSwitch" id="printToggle" aria-pressed="false">
				Версия для печати
			</button>
		</nav>
		
	</header>

	<main>
		<section class="hero">
			<h1 class="hero__title">Изображения <span>без границ</span></h1>
			<p class="hero__subtitle">Покупайте и продавайте уникальные изображения от авторов со всего мира. Тысячи фотографий, иллюстраций и арта — в одном месте.</p>
			<form class="hero__search" action="#">
				<input type="text" name="q" placeholder="Найти изображение..." class="hero__input">
				<button type="submit" class="hero__button">Искать</button>
			</form>
		</section>
	</main>

	<footer class="footer">
		<div class="footer__inner">
			<img src="assets/logo.png" alt="PrimArte" class="footer__logo">
			<ul class="footer__links">
				<li><a href="catalog.html">Каталог товаров</a></li>
				<li><a href="price.html">Прайс-лист</a></li>
				<li><a href="contacts.html">Контакты</a></li>
				<li><a href="about.html">О компании</a></li>
			</ul>
			<p class="footer__copy">&copy; 2026 PrimArte</p>
		</div>
	</footer>
	<script src="print.js" defer></script>
</body>
</html>
